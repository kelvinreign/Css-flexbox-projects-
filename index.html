<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a Set of Colorful Boxes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Colorful Boxes</h1>
    <p class="description">Learning CSS Flexbox through colours and creativity.</p>

    <main class="box-container">
        <div class="box red">Red</div>
        <div class="box orange">Orange</div>
        <div class="box yellow">Yellow</div>
        <div class="box green">Green</div>
        <div class="box blue">Blue</div>
        <div class="box purple">Purple</div>
    </main>

</body>
</html>
